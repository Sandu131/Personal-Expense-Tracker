<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <nav class="navbar">
        <div class="nav-container">
            <span>Personal Expense Tracker</span>
        </div>
    </nav>

    <div class="container">
        <div class="dashboard-header">
            <h2>Financial Dashboard</h2>
            <p>Manage your income and expenses in one place.</p>
        </div>

        <div class="cards">
            <div class="card card-income">
                <span class="card-title">Total Income</span>
                <h3 id="total-income">LKR 0.00</h3>
            </div>
            <div class="card card-expense">
                <span class="card-title">Total Expenses</span>
                <h3 id="total-expenses">LKR 0.00</h3>
            </div>
            <div class="card card-balance">
                <span class="card-title">Current Balance</span>
                <h3 id="current-balance">LKR 0.00</h3>
            </div>
        </div>

        <div class="section-box">
            <h3>Add a Transaction</h3>
            <form id="expense-form">
                <div class="form-grid">
                    <div class="form-group">
                        <label for="type">Transaction Type</label>
                        <select id="type">
                            <option value="Income">Income</option>
                            <option value="Expense">Expense</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="description">Description</label>
                        <input type="text" id="description" placeholder="e.g. Monthly Allowance" required>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount (LKR)</label>
                        <input type="number" id="amount" placeholder="Enter amount" min="0.01" step="0.01" required>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select id="category" required>
                            <option value="" disabled selected>Select a category</option>
                            <option value="Allowance">Allowance</option>
                            <option value="Salary">Salary</option>
                            <option value="Food">Food</option>
                            <option value="Transport">Transport</option>
                            <option value="Education">Education</option>
                            <option value="Entertainment">Entertainment</option>
                            <option value="Shopping">Shopping</option>
                            <option value="Bills">Bills</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <div class="form-group full-width">
                        <label for="date">Transaction Date</label>
                        <input type="date" id="date" required>
                    </div>
                </div>

                <div class="btn-group">
                    <button type="submit" class="btn btn-primary">Add Transaction</button>
                    <button type="button" id="clear-btn" class="btn btn-secondary">Clear Form</button>
                </div>
            </form>
        </div>

        <div class="section-box">
            <h3>Transaction History</h3>
            <div class="filter-row">
                <div class="filter-group">
                    <label for="filter">Filter by Type</label>
                    <select id="filter">
                        <option value="All">All Transactions</option>
                        <option value="Income">Income Only</option>
                        <option value="Expense">Expense Only</option>
                    </select>
                </div>

                <div class="filter-group search-group">
                    <label for="search">Search Transactions</label>
                    <input type="text" id="search" placeholder="Search by description or category">
                </div>
            </div>

            <table>
                <thead>
                    <tr>
                        <th>Date</th>
                        <th>Description</th>
                        <th>Type</th>
                        <th>Category</th>
                        <th>Amount (LKR)</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="list"></tbody>
            </table>
            <div id="no-records" class="no-records">No transactions found.</div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
